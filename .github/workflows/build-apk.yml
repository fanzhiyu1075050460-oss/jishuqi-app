name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable

      - name: Clean and Prepare
        run: |
          flutter clean
          # 兜底：如果目录名带连字符，重命名避免 Gradle 路径问题
          if [ "$(basename $PWD)" != "jishuqi_app" ]; then
            cd ..
            mv jishuqi-app jishuqi_app 2>/dev/null || true
            cd jishuqi_app
          fi
          flutter pub get
          if [ ! -d android ]; then
            flutter create --project-name jishuqi_app --platforms=android .
          fi

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Set Gradle memory
        run: echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - run: flutter build apk --release --verbose
        timeout-minutes: 20

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
